[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://fundingchoicesmessages.google.com https://www.gstatic.com; worker-src 'self'; style-src 'self'; img-src 'self' blob: data: https://fundingchoicesmessages.google.com https://www.gstatic.com; connect-src 'self' https://fundingchoicesmessages.google.com; frame-src 'self' https://fundingchoicesmessages.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
